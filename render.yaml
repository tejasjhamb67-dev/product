# Render blueprint: one web service (API + UI + in-process cron) + managed
# Postgres. Vercel is intentionally not used - the daily brief scheduler and
# the long-running Fastify server need a persistent process, which serverless
# functions don't provide (see deployment plan: Railway/Render/Fly).
#
# Deploy: push this repo to GitHub -> render.com -> New -> Blueprint ->
# point at the repo -> fill in the secret env vars when prompted.

services:
  - type: web
    name: meridian
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: meridian-db
          property: connectionString
      - key: PORT
        value: "3000"
      - key: APP_BASE_URL
        sync: false # e.g. https://meridian.onrender.com (or your domain)
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: SESSION_SIGNING_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: BRIEF_MODEL
        value: claude-sonnet-5
      - key: KITE_API_KEY
        sync: false
      - key: KITE_API_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_PLAN_ID_CORE
        sync: false
      - key: RAZORPAY_PLAN_ID_PRO
        sync: false

databases:
  - name: meridian-db
    plan: basic-256mb
    postgresMajorVersion: "16"
